{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="nav">
        <h1>Heading</h1>
    </div>

    <div class="main">
        <a href="{% url 'addRoom' %}"><button>Add Rooms</button></a>
        <a href="{% url 'viewBooking' %}"><button>View Booking</button></a>

        
        {% for r in room %}
            <a href="{% url 'bookingRoom' r.id %}">
                <div class="cart">
                <h2>Room Name : {{r.room_name}}</h2>
                <h2>Room capacity : {{r.capacity}}</h2>
                <h2>Room location : {{r.location}}</h2>
            </div>
            </a>
        {% endfor %}
            

       
    </div>
</body>
</html>
