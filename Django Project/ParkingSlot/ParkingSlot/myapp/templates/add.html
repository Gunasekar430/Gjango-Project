<!DOCTYPE html>

<html>

<head>

    <title>Add Product</title>

</head>

<body>

<h1>Add Product</h1>


<form method="POST">

    {% csrf_token %}


    <label>Product Name</label>

    <input
        type="text"
        name="name"
        required
    >

    <br><br>


    <label>Category</label>

    <input
        type="text"
        name="category"
        required
    >

    <br><br>


    <label>Quantity</label>

    <input
        type="number"
        name="quantity"
        min="0"
        required
    >

    <br><br>


    <label>Minimum Stock</label>

    <input
        type="number"
        name="minimum_stock"
        min="0"
        required
    >

    <br><br>


    <label>Price</label>

    <input
        type="number"
        step="0.01"
        name="price"
        min="0"
        required
    >

    <br><br>


    <button type="submit">
        Add Product
    </button>


</form>


<br>

<a href="{% url 'index' %}">
    Back
</a>


</body>

</html>
